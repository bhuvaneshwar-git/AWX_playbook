---
- name: Set and lock GNOME wallpaper system-wide (Ubuntu)
  hosts: all
  become: yes

  vars:
    wallpaper_source: "flattrade.png"
    wallpaper_dest: "/usr/share/backgrounds/flattrade.png"
    dconf_profile: "/etc/dconf/profile/user"
    dconf_db_dir: "/etc/dconf/db/local.d"
    dconf_lock_dir: "/etc/dconf/db/local.d/locks"

  tasks:

    - name: Ensure background directory exists
      file:
        path: /usr/share/backgrounds
        state: directory
        mode: '0755'

    # ✅ FIXED COPY TASK (AWX SAFE)
    - name: Copy corporate wallpaper
      become: yes
      become_user: root
      copy:
        src: "{{ wallpaper_source }}"
        dest: "{{ wallpaper_dest }}"
        owner: root
        group: root
        mode: '0644'

    - name: Ensure dconf directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ dconf_db_dir }}"
        - "{{ dconf_lock_dir }}"

    - name: Configure dconf user profile
      become: yes
      become_user: root
      copy:
        dest: "{{ dconf_profile }}"
        content: |
          user-db:user
          system-db:local
        owner: root
        group: root
        mode: '0644'

    - name: Set GNOME wallpaper defaults
      copy:
        dest: "{{ dconf_db_dir }}/00-wallpaper"
        content: |
          [org/gnome/desktop/background]
          picture-uri='file://{{ wallpaper_dest }}'
          picture-uri-dark='file://{{ wallpaper_dest }}'

          [org/gnome/desktop/screensaver]
          picture-uri='file://{{ wallpaper_dest }}'
        owner: root
        group: root
        mode: '0644'

    - name: Lock wallpaper settings
      copy:
        dest: "{{ dconf_lock_dir }}/wallpaper"
        content: |
          /org/gnome/desktop/background/picture-uri
          /org/gnome/desktop/background/picture-uri-dark
          /org/gnome/desktop/screensaver/picture-uri
        owner: root
        group: root
        mode: '0644'

    - name: Update dconf database
      command: dconf update
